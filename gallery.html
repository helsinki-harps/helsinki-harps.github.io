<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helsinki Harps | Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand brand-large" href="index.html">
        <img
          src="assets/badge_HELSINKIharps72dpi.png"
          alt="Helsinki Harps club badge"
          class="logo"
        />
        <div class="brand-text">
          <span class="brand-name">Helsinki Harps</span>
          <span class="brand-subtitle">Community club in Helsinki</span>
        </div>
      </a>

      <button class="menu-toggle" aria-label="Toggle navigation" id="menuToggle">
        Menu
      </button>

      <nav class="site-nav site-nav-wide" id="siteNav">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="nav-cta">Join / Contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="page-header">
        <p class="section-label">Gallery</p>
        <h1 class="page-title">Club photos</h1>
        <p class="section-text">
          Please share your best moments with us via e-mail or social media.
        </p>
      </div>

      <div class="gallery-grid">
        <div class="gallery-item">
          <img
            src="assets/images/training/harps-training.jpeg"
            alt="Helsinki Harps training session"
            width="1200"
            height="800"
            loading="lazy"
          />
      </div>

        <div class="gallery-item">
          <img
            src="assets/images/all-finland-teams-2026.jpg"
            alt="All-Finland Gaelic Football Final August 8 2026 Teams: Helsinki Harps and Jyväskylä"
            width="1200"
            height="800"
            loading="lazy"
          />
        </div>

      	<div class="gallery-item">
          <img
            src="assets/images/all-finland-score-2026.png"
            alt="All-Finland Gaelic Football Final August 8 2026 Score"
            width="1200"
            height="800"
            loading="lazy"
          />
        </div>
        
        <div class="gallery-item">
          <img
            src="assets/images/harps-v-tampere-2022.jpg"
            alt="Harps vs Tampere Hurling Match (2022)"
            width="1200"
            height="800"
            loading="lazy"
          />
        </div>
        
        <div class="gallery-item">
          <img
            src="assets/images/harps-v-tampere-2023.jpg"
            alt="Harps vs Tampere Hurling Match (2023)"
            width="1200"
            height="800"
            loading="lazy"
          />
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>© 2026 Helsinki Harps. All rights reserved.</p>
      <p>Built with GitHub Pages.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
